services:
  postgres:
    # Using the postgis/postgis image (not plain postgres:16) even though the
    # current schema only uses Float lat/lng columns — this keeps a straight
    # upgrade path to real PostGIS geography columns/queries with zero
    # infrastructure change later (see the geospatial note in schema.prisma).
    image: postgis/postgis:16-3.4
    container_name: courier_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: courier
      POSTGRES_PASSWORD: courier
      POSTGRES_DB: courier_dev
    ports:
      - "5432:5432"
    volumes:
      - courier_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: courier_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  courier_pg_data:
